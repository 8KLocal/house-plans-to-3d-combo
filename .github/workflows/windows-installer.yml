name: Windows installer

on:
  pull_request:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as Latest, for example 0.2.0. Empty builds and smoke-tests only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: C:\hp3d-pip-cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  installer:
    # Site publishes are marked [no-release] and must not start this Windows build.
    # A release is still published only by workflow_dispatch with a version.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-release]')) || (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no-release]') && !contains(github.event.pull_request.body, '[no-release]')) }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: C:\hp3d-pip-cache
          key: ${{ runner.os }}-pip-py311-${{ hashFiles('requirements.lock.txt') }}

      - name: Build installer
        id: build
        timeout-minutes: 45
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: House-Plan-3D-Setup
          path: ${{ steps.build.outputs.installer }}
          if-no-files-found: error

      - name: Reject an installer GitHub cannot host as one file
        shell: pwsh
        run: ./packaging/windows/check-size.ps1 -Installer "${{ steps.build.outputs.installer }}"

      # Publishing is explicit. Pull requests and ordinary master pushes must not replace
      # releases/latest while several feature branches are landing. Dispatch with release=0.2.0
      # after master is complete. Not a prerelease: /latest only follows a full release.
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/publish-release.ps1 -Installer "${{ steps.build.outputs.installer }}" -Version "${{ github.event.inputs.release }}"

      - name: Silent install and smoke test
        if: always() && steps.build.conclusion == 'success'
        timeout-minutes: 25
        shell: pwsh
        run: ./packaging/windows/smoke-install.ps1 -Installer "${{ steps.build.outputs.installer }}"
